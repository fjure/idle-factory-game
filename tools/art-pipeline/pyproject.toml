[project]
name = "art-pipeline"
version = "0.1.0"
description = "Deterministic pixel pass, checks and scripted cues for Feature 004 visual identity assets."
requires-python = ">=3.12,<3.14"
dependencies = ["Pillow==11.3.0"]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
